name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 go build ./... && go vet ./...
      - run: go test -timeout 30m ./... # cmd/asuka builds apps for every target: Gradle's first build downloads it
      - name: generated files are up to date
        run: go generate ./ops ./lang/bytecode ./lang/prelude && git diff --exit-code
  # The C core: its tests under ASan and UBSan with the system's compiler
  # (go test ./core, above, with gcc), and with clang; its builds for the
  # web with Zig.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: mlugg/setup-zig@v2
      - run: CC=clang go test -timeout 45m ./core ./internal/cbuild -v
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: swift test --package-path platform/ios
      - name: the core builds for iOS and the simulator, and for macOS
        run: go test ./internal/cbuild -run 'IOS|Host' -v
      - name: the app builds for the simulator
        run: go run ./cmd/asuka build --platform ios --simulator examples/counter
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools } # its default asks for "tools", which the SDK no longer has
      - name: the Kotlin decoder agrees with the golden files; the shell app builds
        working-directory: platform/android
        run: ./gradlew :asuka:testDebugUnitTest :app:assembleDebug
      - name: the core builds for Android
        run: |
          ls -d $ANDROID_HOME/ndk/* 2>/dev/null || sdkmanager "ndk;27.1.12297006"
          go test ./internal/cbuild -run Android -v
  # The Linux host on real GTK 4 and libadwaita, under Xvfb and a
  # session bus; then the examples on it (e2e/).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: GTK 4, libadwaita, WebKitGTK, libsoup 3, Poppler, a display and a session bus
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-1 libadwaita-1-0 libwebkitgtk-6.0-4 libsoup-3.0-0 libpoppler-glib8t64 xvfb dbus clang
      - uses: mlugg/setup-zig@v2
      - name: the prebuilt libraries (Zig's, as a release builds them) link with gcc and clang
        run: xvfb-run -a dbus-run-session go test ./cmd/asuka -run LinuxPrebuiltFromZig -v
      - name: the Linux host, driving real GTK widgets
        run: xvfb-run -a dbus-run-session go test ./platform/linux
      - name: GUI tests, the examples on GTK
        run: xvfb-run -a -s '-screen 0 1400x1000x24' dbus-run-session go test -tags e2e -timeout 60m ./e2e -run Linux -skip PublishLinuxS3 -v
      # The test starts RustFS itself (internal/s3test), and Debian and
      # Fedora containers in its network.
      - name: asuka publish to S3 (RustFS, in Docker); apt and dnf install and upgrade from it
        run: xvfb-run -a dbus-run-session go test -tags e2e -timeout 30m ./e2e -run PublishLinuxS3 -v
      - name: a release builds
        run: go run ./cmd/asuka build --platform linux examples/counter && tar -tzf examples/counter/dist/linux-amd64/counter-*.tar.gz
  # GUI tests: the examples on a simulator and an emulator, driven
  # through the debug hosts' automation (e2e/).
  e2e-ios:
    runs-on: macos-latest
    steps:
      # A fresh runner's first boot of a simulator takes minutes: started
      # first, it goes on while the rest sets up, and asuka dev takes the
      # iPhone that's booting.
      - name: an iPhone simulator, booting
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone.* Pro$"))][0].udid')
          echo "booting $udid"
          nohup xcrun simctl boot "$udid" > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go test -tags e2e -timeout 60m ./e2e -run IOS -v # the first builds the player on a fresh runner (minutes)
  e2e-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools } # its default asks for "tools", which the SDK no longer has
      - name: an NDK
        run: ls -d $ANDROID_HOME/ndk/* 2>/dev/null || sdkmanager "ndk;27.1.12297006"
      - name: KVM, for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6 # a phone's screen (the default's is 320×640, where a page's fields start below it)
          script: go test -tags e2e -timeout 60m ./e2e -run Android -v
