name: release
# A tag v1.2.3 publishes the CLI: its npm packages (@egoist/asuka and a
# prebuilt binary per platform), the libraries it carries prebuilt (an
# @egoist/asuka-prebuilt-<target> package per target, which the CLI
# fetches from npm when a build first needs one), and a GitHub release
# with the binaries, for the shell installer.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm provenance
jobs:
  # What the CLI carries prebuilt, one target each (asuka prebuilt
  # targets): the core's, the desktop hosts' and the std and sdk packages'
  # C as static libraries, the Swift hosts and packages as modules with
  # library evolution, the Android host's and packages' AARs.
  # Apple's targets on macOS with Xcode; the rest on Linux, their C
  # Zig's as on any system (ASUKA_CC=zig: Linux's too, against the glibc
  # the libraries target, not the runner's), Android's the NDK's.
  prebuilt:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: ios-arm64, os: macos-15 }
          - { target: ios-sim-arm64, os: macos-15 }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15 }
          - { target: android-arm64-v8a, os: ubuntu-latest }
          - { target: android-armeabi-v7a, os: ubuntu-latest }
          - { target: android-x86_64, os: ubuntu-latest }
          - { target: android-aar, os: ubuntu-latest }
          - { target: wasm32, os: ubuntu-latest }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-latest }
          - { target: windows-x64, os: ubuntu-latest }
          - { target: windows-arm64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      # The oldest Xcode Asuka supports (its SDK has the iOS 26 and macOS
      # 26 APIs the hosts call): a module's .swiftinterface is read by the
      # swiftc that wrote it and later ones, not earlier ones, so the
      # prebuilt Swift serves every supported Xcode. Raise it only with
      # the minimum.
      - name: Xcode 26.0
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.0.app && xcrun swiftc --version
      - uses: mlugg/setup-zig@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: an NDK
        run: ls -d $ANDROID_HOME/ndk/* 2>/dev/null || sdkmanager "ndk;27.1.12297006"
      - name: build
        run: go run ./cmd/asuka prebuilt build --target ${{ matrix.target }} --version "${GITHUB_REF_NAME#v}" --out "dist/prebuilt/${{ matrix.target }}"
        env:
          ASUKA_CACHE: ${{ runner.temp }}/asuka-cache
          # Not `macOS && '' || 'zig'`: '' is falsy, so that's always zig.
          ASUKA_CC: ${{ runner.os != 'macOS' && 'zig' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: dist/prebuilt/${{ matrix.target }}
          if-no-files-found: error
  cli:
    needs: prebuilt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: dist/prebuilt
      # The prebuilt packages packed, their manifest (each tarball's
      # integrity) embedded in the CLI, which is built for each platform;
      # then, once everything is built, the prebuilt and platform packages
      # published, and the launcher (@egoist/asuka) last, once the
      # registry serves each of them (fetched and checked as the CLI
      # does): npm accepts a package minutes before it serves a new one's
      # tarball, and a launcher out first installs a CLI whose builds
      # can't fetch their libraries.
      - name: npm
        run: go run ./scripts/npm -version "${GITHUB_REF_NAME#v}" -prebuilt dist/prebuilt -out dist/npm -publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: the GitHub release
        run: |
          mkdir -p dist/bin
          for d in dist/npm/cli-*; do
            p=${d#dist/npm/cli-}
            f=$(ls $d/bin/asuka*)
            case "$f" in *.exe) cp "$f" "dist/bin/asuka-$p.exe" ;; *) cp "$f" "dist/bin/asuka-$p" ;; esac
          done
          (cd dist/bin && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/bin/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
