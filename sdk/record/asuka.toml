name = "platform/record"
version = "0.1.0"
description = "Sound from the microphone, and video from the camera, recorded to files"

[ios.usage]
NSMicrophoneUsageDescription = "The microphone records sound."

[android]
permissions = ["android.permission.RECORD_AUDIO", "android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_MICROPHONE", "android.permission.POST_NOTIFICATIONS"]

[windows]
libraries = ["winmm", "advapi32", "ole32"]

# Its sound is GStreamer's, through the sound server: a Flatpak's socket
# to it.
[linux]
flatpak = ["--socket=pulseaudio"]
# GStreamer, and its codecs: what a .deb or an .rpm of the app depends on.
deb = ["gstreamer1.0-plugins-base"]
debRecommends = ["gstreamer1.0-plugins-good", "gstreamer1.0-libav"]
rpm = ["gstreamer1-plugins-base"]
rpmRecommends = ["gstreamer1-plugins-good", "gstreamer1-plugin-libav"]
