name = "platform/calendar"
version = "0.1.0"
description = "The user's calendars: their events, and new ones"

[ios.usage]
NSCalendarsFullAccessUsageDescription = "To show and add your events."
NSCalendarsWriteOnlyAccessUsageDescription = "To add events to your calendar."
# Before iOS 17's levels of access.
NSCalendarsUsageDescription = "To show and add your events."

[android]
permissions = ["android.permission.READ_CALENDAR", "android.permission.WRITE_CALENDAR"]

# The host's calendar module (EventKit).
[ios]
hostFlags = ["ASUKA_CALENDAR"]

# Evolution Data Server, the desktop's calendars: what a .deb or an .rpm
# of the app depends on.
[linux]
deb = ["evolution-data-server"]
rpm = ["evolution-data-server"]
