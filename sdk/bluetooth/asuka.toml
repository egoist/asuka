name = "platform/bluetooth"
version = "0.1.0"
description = "Bluetooth Low Energy: central and peripheral"

[ios]
usage = { NSBluetoothAlwaysUsageDescription = "To connect to your Bluetooth devices." }

[android]
# Android 12's nearby devices permissions: the scan's "neverForLocation"
# unless the app's asuka.toml has bluetooth.location. Before 12 (":30":
# up to Android 11), the install's Bluetooth permissions, and the location
# permission a scan needs there.
permissions = ["android.permission.BLUETOOTH_SCAN|neverForLocation", "android.permission.BLUETOOTH_CONNECT", "android.permission.BLUETOOTH_ADVERTISE",
  "android.permission.BLUETOOTH:30", "android.permission.BLUETOOTH_ADMIN:30", "android.permission.ACCESS_FINE_LOCATION:30"]

# A background scan: iOS's bluetooth-central mode, with which the central
# manager has its restore identifier (iOS keeps the scan when it ends the
# app, and starts the app again for it: the launch class makes the
# manager before launch ends); Android's receiver for the scan the
# system runs, which outlives the app's process. (asuka.toml's
# bluetooth.background gives an app the modes, and the launch class, for
# its connections.)
[uses.backgroundScan.ios]
backgroundModes = ["bluetooth-central"]
launch = "AsukaBluetoothLaunch"

[uses.backgroundScan.android]
application = ['<receiver android:name="platform.bluetooth.BluetoothScanReceiver" android:exported="false" />']

# BlueZ, on the system bus, from a Flatpak.
[linux]
flatpak = ["--system-talk-name=org.bluez"]
