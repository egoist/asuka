name = "Services"
id = "dev.asuka.services"
scheme = "asukaservices"
icon = "icon.png"

# The icons the app may show instead (platform/appicon).
[alternateIcons]
night = "icons/night.png"
sunset = "icons/sunset.png"

[ios.locationPurposes]
route = "To draw your route exactly."

[splash]
image = "logo.png"
size = 96
background = "#4A63B5"
darkBackground = "#1B2440"

[[widgets]]
kind = "energy"
name = "Energy"
description = "Your moves today"
sizes = ["small", "medium", "large", "circular", "rectangular", "inline"]

[[shortcuts]]
id = "sayHello"
title = "Say Hello"
url = "asukaservices://speak"
symbol = "bell"
phrases = ["Say hello with ${app}"]

# A shortcut with a parameter: Siri asks which greeting, or hears it in
# the phrase ("Say goodbye with Services"); it fills {words} in the URL.
[[shortcuts]]
id = "say"
title = "Say"
url = "asukaservices://say?words={words}"
symbol = "text.bubble"
phrases = ["Say ${words} with ${app}", "Say something with ${app}"]

[[shortcuts.params]]
name = "words"
title = "Greeting"
type = "options"
options = [{ value = "Hello from Asuka", title = "hello" }, { value = "Goodbye from Asuka", title = "goodbye" }]
prompt = "Which greeting?"

[[shortcuts]]
id = "openMap"
title = "Open the Map"
url = "asukaservices://map"
symbol = "map"
phrases = ["Open the map in ${app}"]
